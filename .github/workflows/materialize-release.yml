name: Materialize Release Artifacts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-release.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: purrfect
          POSTGRES_PASSWORD: purrfect
          POSTGRES_DB: purrfect_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U purrfect -d purrfect_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://purrfect:purrfect@127.0.0.1:5432/purrfect_release?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Enable pnpm
        run: corepack enable

      - name: Materialize lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Prove frozen install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Generate baseline migration
        run: |
          mkdir -p packages/database/prisma/migrations/00000000000000_init
          pnpm --filter @purrfect/database exec prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output prisma/migrations/00000000000000_init/migration.sql
          printf 'provider = "postgresql"\n' > packages/database/prisma/migrations/migration_lock.toml

      - name: Apply migration to empty PostgreSQL
        run: pnpm --filter @purrfect/database exec prisma migrate deploy

      - name: Check migration status
        run: pnpm --filter @purrfect/database exec prisma migrate status

      - name: Prove migration matches Prisma schema
        run: |
          set +e
          pnpm --filter @purrfect/database exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema prisma/schema.prisma \
            --exit-code > migration-drift.txt
          code=$?
          cat migration-drift.txt
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            pnpm-lock.yaml
            packages/database/prisma/migrations
          if-no-files-found: error
