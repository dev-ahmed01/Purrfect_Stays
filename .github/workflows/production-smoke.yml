name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: Production web origin, e.g. https://purrfect-stays.vercel.app
        required: true
        type: string
      api_url:
        description: Production API base URL, e.g. https://purrfect-api.up.railway.app/api/v1
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Run production smoke
        env:
          WEB_BASE_URL: ${{ inputs.web_url }}
          API_BASE_URL: ${{ inputs.api_url }}
        run: node scripts/release-smoke.mjs
