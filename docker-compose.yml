services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: purrfect
      POSTGRES_PASSWORD: purrfect
      POSTGRES_DB: purrfect_stays
    ports:
      - "5432:5432"
    volumes:
      - purrfect_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purrfect -d purrfect_stays"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - purrfect_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  purrfect_postgres:
  purrfect_redis:
